<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FNX CapPlan – AI Capacity & Resource Planning</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="login-page">
      <!-- Background orbs -->
      <div class="login-bg-orb orb1"></div>
      <div class="login-bg-orb orb2"></div>

      <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
          <div class="icon"><i class="fa-solid fa-layer-group"></i></div>
          <div class="brand">FNX Cap<span>Plan</span></div>
        </div>

        <h2 class="login-title">Welcome back</h2>
        <p class="login-sub">
          AI-powered capacity &amp; resource planning for engineering consulting projects
        </p>

        <!-- Form -->
        <div class="form-group">
          <label class="form-label"
            >Work Email <span class="req">*</span></label
          >
          <input
            type="email"
            class="form-control"
            placeholder="pm@yourcompany.com"
            value="admin@fnx.ca"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Password <span class="req">*</span></label>
          <div style="position: relative">
            <input
              type="password"
              class="form-control"
              id="pwd-input"
              placeholder="••••••••"
              value="Admin@123"
              style="padding-right: 42px"
            />
            <button
              onclick="togglePwd()"
              style="
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
                font-size: 14px;
              "
            >
              <i class="fa-regular fa-eye" id="pwd-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Workspace</label>
          <div
            style="
              display: flex;
              align-items: stretch;
              border: 1.5px solid var(--border);
              border-radius: var(--r-md);
              overflow: hidden;
              transition: border-color 0.15s;
            "
            id="ws-wrap"
          >
            <span
              style="
                padding: 9px 13px;
                background: var(--bg);
                color: var(--text-muted);
                font-size: 13.5px;
                border-right: 1px solid var(--border);
                white-space: nowrap;
                display: flex;
                align-items: center;
              "
              >fnx.capplan.io/</span
            >
            <input
              type="text"
              style="
                border: none;
                outline: none;
                padding: 9px 13px;
                font-size: 13.5px;
                flex: 1;
                color: var(--text-primary);
              "
              placeholder="yourcompany"
              value="fnx"
              onfocus="
                document.getElementById('ws-wrap').style.borderColor =
                  'var(--primary)'
              "
              onblur="
                document.getElementById('ws-wrap').style.borderColor =
                  'var(--border)'
              "
            />
          </div>
        </div>

        <div
          style="display: flex; justify-content: flex-end; margin-bottom: 20px"
        >
          <a
            href="#"
            style="color: var(--primary); font-size: 13px; font-weight: 700"
            >Forgot password?</a
          >
        </div>

        <a href="app.html">
          <button
            class="btn btn-primary"
            style="
              width: 100%;
              justify-content: center;
              padding: 12px;
              font-size: 15px;
            "
          >
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
        </a>

        <div class="login-divider"><span>or continue with</span></div>

        <button class="sso-btn">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path
              d="M17.64 9.2a10.3 10.3 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91a8.78 8.78 0 0 0 2.69-6.62z"
              fill="#4285F4"
            />
            <path
              d="M9 18a8.6 8.6 0 0 0 5.96-2.18l-2.91-2.26a5.4 5.4 0 0 1-8.05-2.84H.96v2.33A9 9 0 0 0 9 18z"
              fill="#34A853"
            />
            <path
              d="M3.96 10.72A5.42 5.42 0 0 1 3.68 9a5.42 5.42 0 0 1 .28-1.72V4.95H.96A9 9 0 0 0 0 9a9 9 0 0 0 .96 4.05l3-2.33z"
              fill="#FBBC05"
            />
            <path
              d="M9 3.58a4.86 4.86 0 0 1 3.44 1.35l2.58-2.58A8.64 8.64 0 0 0 9 0 9 9 0 0 0 .96 4.95l3 2.33A5.36 5.36 0 0 1 9 3.58z"
              fill="#EA4335"
            />
          </svg>
          Sign in with Google SSO
        </button>

        <!-- Quick Demo Roles -->
        <div class="demo-roles">
          <p>
            <i class="fa-solid fa-bolt" style="color: var(--warning)"></i> Quick
            Preview
          </p>
          <div class="role-chips">
            <span class="role-chip" onclick="goApp()"
              ><i class="fa-solid fa-user-tie"></i> Project Manager</span
            >
            <span class="role-chip" onclick="goApp()"
              ><i class="fa-solid fa-chart-gantt"></i> Planning Manager</span
            >
            <span class="role-chip" onclick="goApp()"
              ><i class="fa-solid fa-coins"></i> Finance Manager</span
            >
            <span class="role-chip" onclick="goApp()"
              ><i class="fa-solid fa-shield-halved"></i> Admin</span
            >
          </div>
        </div>

        <p
          style="
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 20px;
          "
        >
          Don't have an account?
          <a href="#" style="color: var(--primary); font-weight: 700"
            >Request Access</a
          >
        </p>

        <!-- Feature pills removed -->
      </div>
    </div>

    <script>
      function togglePwd() {
        const input = document.getElementById("pwd-input");
        const eye = document.getElementById("pwd-eye");
        if (input.type === "password") {
          input.type = "text";
          eye.className = "fa-regular fa-eye-slash";
        } else {
          input.type = "password";
          eye.className = "fa-regular fa-eye";
        }
      }
      function goApp() {
        window.location.href = "app.html";
      }
    </script>
  </body>
</html>
